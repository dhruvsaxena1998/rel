# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: REL Release

permissions:
  contents: write 

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release (e.g., v1.0.0)'
        required: true
      release_notes:
        description: 'Notes for the GitHub Release'
        required: false

jobs:
  build:
    name: Build and Release Go Binary
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build for Linux
      run: |
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/rel-linux-amd64 ./cmd/cli/main.go
        chmod +x bin/rel-linux-amd64

    - name: Build for Linux ARM64
      run: |
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bin/rel-linux-arm64 ./cmd/cli/main.go
        chmod +x bin/rel-linux-arm64

    - name: Build for macOS
      run: |
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/rel-darwin-amd64 ./cmd/cli/main.go
        chmod +x bin/rel-darwin-amd64

    - name: Build for macOS ARM64
      run: |
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/rel-darwin-arm64 ./cmd/cli/main.go
        chmod +x bin/rel-darwin-arm64

    - name: Build for Windows
      run: |
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/rel-windows-amd64.exe ./cmd/cli/main.go

    - name: Generate checksums
      run: |
        cd bin
        sha256sum * > checksums.txt

    - name: Create formatted release body
      run: |
        echo "${{ github.event.inputs.release_notes }}" > release_body.md
        echo "" >> release_body.md
        echo "## 📦 Downloads" >> release_body.md
        echo "" >> release_body.md
        echo "| File | SHA256 |" >> release_body.md
        echo "|------|--------|" >> release_body.md
        cd bin
        while IFS= read -r line; do
          checksum=$(echo "$line" | cut -d' ' -f1)
          filename=$(echo "$line" | cut -d' ' -f2-)
          echo "| \`$filename\` | \`$checksum\` |" >> ../release_body.md
        done < checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        body_path: release_body.md
        files: |
          bin/rel-linux-amd64
          bin/rel-linux-arm64
          bin/rel-darwin-amd64
          bin/rel-darwin-arm64
          bin/rel-windows-amd64.exe
          bin/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}